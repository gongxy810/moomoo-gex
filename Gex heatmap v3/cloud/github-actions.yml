name: Test and publish GEX v3 deployment
on:
  push:
    branches: [main]
    paths: ['Gex heatmap v3/**', '.github/workflows/gex-v3.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gex-v3-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: Gex heatmap v3
      - run: npm test
        working-directory: Gex heatmap v3
      - run: python -m unittest discover -s tests -p 'test_*.py'
        working-directory: Gex heatmap v3
      - name: Publish tested deployment ref
        run: |
          git tag -f gex-v3-tested "$GITHUB_SHA"
          git push origin refs/tags/gex-v3-tested --force
